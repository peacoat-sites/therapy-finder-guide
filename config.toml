baseURL = "https://therapyfinderguide.com/"
enableGitInfo = true
languageCode = "en-us"
title = "Therapy Finder Guide"

enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 12

[params]
  page_bg = "#faf5ff"
  nav_style = "light"
  description = "Practical guides to finding therapists, understanding therapy types, and navigating mental health care."
  niche = "Mental Health & Therapy"
  adsense_id = "ca-pub-3466203197759215"
  adsense_slot_header = "auto"
  adsense_slot_incontent = "auto"
  adsense_slot_sidebar = "auto"
  image_query = "therapy mental health counseling wellness calm"
  author = "Therapy Finder Guide Editorial Team"
  logo_text = "Therapy Finder Guide"
  tagline = "Find the right therapy for you ,  mental health resources without the jargon"
  cloudflare_analytics = ""

  # Authority theme
  monthly_readers = 43000
  research_hours  = 380
  satisfaction    = 98
  trust_extra     = "Mental health professionals consulted"
  impact_verification = ""
  impact_tracking_id  = ""
  persona_name       = "Megan Strand"
  persona_title      = "Mental Wellness Editor"
  persona_bio        = "Megan is a mental wellness writer who has spent years researching access to mental health care ,  how people find therapists, what different therapy types involve, and how to navigate insurance coverage for mental health services. She writes to make the process of starting therapy less overwhelming."
  persona_initials   = "MS"
  disclaimer         = "This site provides general mental health information only and is not a substitute for professional mental health care. If you are in crisis, please contact the 988 Suicide & Crisis Lifeline by calling or texting 988."

logo_text_1 = "Therapy"
logo_text_2 = "Finder"
primary_color = "#7c3aed"
hero_color_1 = "#07000f"
hero_color_2 = "#100020"
hero_color_3 = "#a78bfa"
hero_color_4 = "#040009"
[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[permalinks]
  posts = "/:slug/"

[related]
  includeNewer = true
  threshold    = 80
  toLower      = false
  [[related.indices]]
    name   = "keywords"
    weight = 100
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 50

[services]
  [services.googleAnalytics]
    id = "G-S7KFSXV04M"
